<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBD HD - Latest Movies & Dramas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f0f0f; color: #fff; min-height: 100vh; padding-bottom: 80px; position: relative; }
        
        header { background: #1a1a1a; display: flex; justify-content: space-between; align-items: center; padding: 12px 5%; border-bottom: 3px solid #e50914; position: relative; }
        .logo h2 a { color: #fff; text-decoration: none; font-size: 1.5rem; font-weight: bold; cursor: pointer; }
        .logo span { color: #e50914; }
        .menu-toggle { background: #e50914; border: none; color: #fff; padding: 8px 12px; font-size: 1.2rem; border-radius: 4px; cursor: pointer; }
        
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #fff; color: #333; z-index: 1000; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .dropdown-menu.active { display: block; }
        .dropdown-menu ul { list-style: none; }
        .dropdown-menu ul li { border-bottom: 1px solid #eee; }
        .dropdown-menu ul li a { display: block; padding: 12px 20px; color: #333; text-decoration: none; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
        .dropdown-menu ul li a:hover { background: #f4f4f4; color: #e50914; }

        .search-container { background: #151515; padding: 12px 5%; display: flex; justify-content: center; border-bottom: 1px solid #222; }
        .search-box { display: flex; align-items: center; background: #252525; border: 1px solid #444; border-radius: 20px; padding: 6px 15px; width: 100%; max-width: 500px; }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 0.9rem; padding: 3px; }
        .search-box i { color: #aaa; margin-right: 8px; }

        .category-bar { background: #151515; padding: 10px 5%; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid #222; }
        .cat-btn { background: #222; color: #ccc; padding: 6px 14px; border-radius: 20px; border: 1px solid #333; cursor: pointer; font-size: 0.85rem; white-space: nowrap; transition: 0.2s; }
        .cat-btn:hover, .cat-btn.active { background: #e50914; color: #fff; border-color: #e50914; }
        
        .movie-section { padding: 25px 5%; }
        .latest-heading { background: #1a1a1a; border-left: 5px solid #e50914; color: white; padding: 10px 15px; font-size: 1.1rem; font-weight: bold; border-radius: 4px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
        .movie-card { background: #181818; border-radius: 6px; overflow: hidden; border: 1px solid #222; transition: 0.3s; cursor: pointer; display: block; }
        .movie-card:hover { transform: translateY(-5px); border-color: #e50914; }
        .poster-container { position: relative; }
        .movie-card img { width: 100%; height: 280px; object-fit: cover; }
        .quality-badge { position: absolute; top: 10px; right: 10px; background: #e50914; color: white; padding: 3px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 3px; }
        .movie-info { padding: 12px; text-align: center; }
        .movie-info h3 { font-size: 0.95rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .category-tag { font-size: 0.8rem; color: #aaa; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 35px; flex-wrap: wrap; }
        .page-btn { background: #1f1f1f; color: #fff; border: 1px solid #333; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .page-btn:hover, .page-btn.active { background: #e50914; border-color: #e50914; }

        #movie-details-view { display: none; padding: 30px 5%; max-width: 750px; margin: 0 auto; }
        .container-box { background: #141414; padding: 20px; border-radius: 8px; border: 1px solid #222; text-align: center; }
        .notice { background: #fff; color: #000; padding: 8px; font-weight: bold; font-size: 0.9rem; border-radius: 4px; margin-bottom: 15px; }
        .main-poster { width: 100%; max-height: 450px; object-fit: contain; border-radius: 6px; margin-bottom: 15px; background: #000; }
        h1.movie-title { font-size: 1.2rem; margin-bottom: 15px; line-height: 1.4; }
        .details-box { text-align: left; background: #1c1c1c; padding: 12px; border-radius: 6px; font-size: 0.85rem; color: #ccc; margin-bottom: 20px; line-height: 1.6; }
        .telegram-btn { display: inline-flex; align-items: center; gap: 8px; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 0.85rem; font-weight: bold; margin-bottom: 20px; }
        
        .section-heading { background: #e50914; color: white; padding: 8px; font-size: 0.95rem; font-weight: bold; border-radius: 4px; margin: 20px 0 15px 0; }
        .quality-section { margin-bottom: 25px; border-bottom: 1px dashed #333; padding-bottom: 15px; text-align: center; }
        .quality-header-btn { display: inline-block; background: #d9534f; color: white; padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 12px; border: 2px solid #ff4d4d; }
        .link-item { display: block; background: #1f1f1f; color: #4da6ff; padding: 8px; margin: 6px 0; border-radius: 4px; text-decoration: none; font-size: 0.85rem; border: 1px solid #2d2d2d; transition: 0.2s; text-align: center; }
        .link-item:hover { background: #252525; color: #fff; border-color: #4da6ff; }
        
        .screenshots-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .screenshots-grid img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; border: 1px solid #333; }
        .back-home { display: inline-block; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 0.9rem; cursor: pointer; }
        .back-home:hover { color: #fff; }

        footer { text-align: center; padding: 20px; background: #151515; color: #777; border-top: 1px solid #222; position: absolute; bottom: 0; width: 100%; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><h2><a onclick="showHome()"><i class="fa-solid fa-film"></i> CineBD<span>HD</span></a></h2></div>
        <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>

        <div class="dropdown-menu" id="dropdownMenu">
            <ul>
                <li><a onclick="showHome(); toggleMenu();">Home</a></li>
                <li><a href="admin.html">Admin Panel</a></li>
                <li><a href="#">How To Download</a></li>
                <li><a href="#">DMCA</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="মুভি বা নাটক সার্চ করুন..." onkeyup="searchMovies()">
        </div>
    </div>

    <div id="home-view">
        <div class="category-bar" id="category-bar">
            <button class="cat-btn active" onclick="filterMovies('সব', this)">সব মুভি/নাটক</button>
        </div>

        <main class="movie-section">
            <div class="latest-heading" id="current-category-title">
                <i class="fa-solid fa-fire"></i> সাম্প্রতিক সংযোজিত কনটেন্ট
            </div>
            
            <div class="movie-grid" id="movie-grid">
                <p style="color: #aaa;">লোড হচ্ছে...</p>
            </div>

            <div class="pagination" id="pagination"></div>
        </main>
    </div>

    <div id="movie-details-view">
        <div class="container-box" id="details-content"></div>
    </div>

    <footer>
        <p>&copy; 2026 CineBD HD. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1ZubF0ZPvtdhcWWBa2PGorU7lx0OkN4I",
            authDomain: "admin-726ec.firebaseapp.com",
            databaseURL: "https://admin-726ec-default-rtdb.firebaseio.com",
            projectId: "admin-726ec",
            storageBucket: "admin-726ec.firebasestorage.app",
            messagingSenderId: "97796496921",
            appId: "1:97796496921:web:4bf82701a35b6caca4d488",
            measurementId: "G-Y8Y7S92HD0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allMovies = [];
        let currentFilteredMovies = [];
        let currentPage = 1;
        const moviesPerPage = 12;

        window.toggleMenu = function() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('active');
        }

        async function loadData() {
            try {
                const catSnap = await getDocs(collection(db, "categories"));
                const catBar = document.getElementById('category-bar');
                catBar.innerHTML = '<button class="cat-btn active" onclick="filterMovies(\'সব\', this)">সব মুভি/নাটক</button>';

                catSnap.forEach(docSnap => {
                    const catName = docSnap.data().name;
                    const btn = document.createElement('button');
                    btn.className = 'cat-btn';
                    btn.innerText = catName;
                    btn.onclick = () => filterMovies(catName, btn);
                    catBar.appendChild(btn);
                });

                const movieSnap = await getDocs(collection(db, "movies"));
                allMovies = [];
                movieSnap.forEach(docSnap => {
                    allMovies.push({ id: docSnap.id, ...docSnap.data() });
                });

                currentFilteredMovies = allMovies;
                displayPage(1);
            } catch (error) {
                console.error(error);
            }
        }

        window.displayPage = function(page) {
            currentPage = page;
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            
            if(currentFilteredMovies.length === 0) {
                grid.innerHTML = '<p style="color:#aaa;">কোনো মুভি বা নাটক পাওয়া যায়নি।</p>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const start = (page - 1) * moviesPerPage;
            const end = start + moviesPerPage;
            const paginatedItems = currentFilteredMovies.slice(start, end);

            paginatedItems.forEach(m => {
                grid.innerHTML += `
                    <div class="movie-card" onclick="showMovieDetails('${m.id}')">
                        <div class="poster-container">
                            <img src="${m.poster}" alt="${m.title}">
                            <span class="quality-badge">${m.quality}</span>
                        </div>
                        <div class="movie-info">
                            <h3>${m.title}</h3>
                            <p class="category-tag">${m.category}</p>
                        </div>
                    </div>
                `;
            });

            setupPagination();
        }

        function setupPagination() {
            const paginationEl = document.getElementById('pagination');
            paginationEl.innerHTML = '';
            
            const pageCount = Math.ceil(currentFilteredMovies.length / moviesPerPage);
            if (pageCount <= 1) return;

            for (let i = 1; i <= pageCount; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    displayPage(i);
                    window.scrollTo({ top: 300, behavior: 'smooth' });
                };
                paginationEl.appendChild(btn);
            }
        }

        window.searchMovies = function() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            document.getElementById('current-category-title').innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> সার্চ ফলাফল: "${query}"`;
            
            currentFilteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(query) || m.category.toLowerCase().includes(query));
            displayPage(1);
        }

        window.filterMovies = function(cat, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('search-input').value = '';
            document.getElementById('current-category-title').innerHTML = `<i class="fa-solid fa-film"></i> ${cat} কনটেন্ট`;
            
            if(cat === 'সব') {
                currentFilteredMovies = allMovies;
            } else {
                currentFilteredMovies = allMovies.filter(m => m.category === cat);
            }
            displayPage(1);
        }

        window.showMovieDetails = function(id) {
            const m = allMovies.find(item => item.id === id);
            if(!m) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('movie-details-view').style.display = 'block';
            window.scrollTo(0, 0);

            const renderLinks = (qualityName, linksObj) => {
                if (!linksObj) return '';
                let html = `
                    <div class="quality-section">
                        <div class="quality-header-btn">⚡ Download Link ${qualityName} Links ⚡</div>
                `;
                if(linksObj.index) html += `<a href="${linksObj.index}" target="_blank" class="link-item">01. One Click Download Links (Index Link)</a>`;
                if(linksObj.gdx) html += `<a href="${linksObj.gdx}" target="_blank" class="link-item">Click Here To Download [GDxShare]</a>`;
                if(linksObj.gofile) html += `<a href="${linksObj.gofile}" target="_blank" class="link-item">Click Here To Download [Gofile]</a>`;
                if(linksObj.terabox) html += `<a href="${linksObj.terabox}" target="_blank" class="link-item">Click Here To Download [TeraBox] (All Time Work)</a>`;
                html += `</div>`;
                return html;
            };

            document.getElementById('details-content').innerHTML = `
                <div class="notice">**এই কনটেন্টে কোনো ক্ষতিকর বিজ্ঞাপন নেই..**</div>
                <img src="${m.poster}" alt="${m.title}" class="main-poster">
                <h1 class="movie-title">${m.title}</h1>
                <div class="details-box">
                    <strong>ক্যাটাগরি:</strong> ${m.category} | <strong>কোয়ালিটি:</strong> ${m.quality}
                </div>
                <a href="${m.telegram || '#'}" target="_blank" class="telegram-btn">
                    <i class="fa-brands fa-telegram"></i> টেলিগ্রাম চ্যানেলে জয়েন করুন
                </a>
                <div class="section-heading"><i class="fa-solid fa-download"></i> Download Links</div>
                ${renderLinks('720p', m.p720)}
                ${renderLinks('1080p', m.p1080)}
                <div class="section-heading"><i class="fa-solid fa-camera"></i> Screenshots</div>
                <div class="screenshots-grid">
                    <img src="${m.ss1 || m.poster}" alt="Screenshot">
                    <img src="${m.ss2 || m.poster}" alt="Screenshot">
                </div>
                <br>
                <a class="back-home" onclick="showHome()"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>
            `;
        }

        window.showHome = function() {
            document.getElementById('movie-details-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        loadData();
    </script>
</body>
</html>
