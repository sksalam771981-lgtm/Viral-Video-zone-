<!DOCTYPE html>
<html lang="bn">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Tailwind CSS -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

    <!-- টপ হেডার বার -->
    <header class="bg-red-700/90 border-b border-red-800 px-4 py-3.5 sticky top-0 z-40 backdrop-blur-md shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">

    <div class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- ২. আলাদা ক্যাটাগরি ম্যানেজমেন্ট বক্স -->

            </h2>
            
            <!-- নতুন ক্যাটাগরি যুক্ত করার ফর্ম -->
            <div class="flex flex-col sm:flex-row gap-2.5">
                <input type="text" id="new-category-input" placeholder="নতুন ক্যাটাগরির নাম লিখুন (যেমন: Bangladeshi Movie)..." class="flex-1 bg-slate-950 border border-slate-700 p-3 rounded-xl text-xs text-white outline-none focus:border-emerald-500 transition">
                <button onclick="addCategory()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold px-5 py-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-plus"></i> ক্যাটাগরি যুক্ত করুন

            <!-- বর্তমানে সেভ থাকা ক্যাটাগরি তালিকা -->

                <span class="text-[11px] text-slate-400 font-semibold block">সেভ করা ক্যাটাগরি সমূহ:</span>
                <div id="saved-categories-container" class="flex flex-wrap gap-2">
                    <span class="text-xs text-slate-500">লোড হচ্ছে...</span>
                </div>
            </div>
        </div>

        <!-- ৩. ভিডিও পোস্ট বা এডিট করার মূল ফর্ম -->
        <div id="post-form-card" class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
            
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 id="form-heading" class="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-red-500"></i> নতুন পোস্ট পাবলিশ করুন
                </h2>
                <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs px-3.5 py-1.5 rounded-lg text-slate-200 transition">
                    <i class="fa-solid fa-xmark"></i> এডিট বাতিল
                </button>
            </div>

            <!-- এডিট আইডি ট্র্যাকার -->
            <input type="hidden" id="edit-post-id" value="">

            <!-- ভিডিওর শিরোনাম (Title) -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-300 block">ভিডিওর শিরোনাম (Title):</label>
                <input type="text" id="post-title" placeholder="ভিডিওর শিরোনাম লিখুন..." class="w-full bg-slate-950 border border-slate-700 p-3 rounded-2xl text-xs text-white outline-none focus:border-red-500 transition">
            </div>

            <!-- ক্যাটাগরি সিলেক্টর (সেভ করা ক্যাটাগরি থেকে) -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-300 flex justify-between items-center">
                    <span>ক্যাটাগরি সিলেক্ট করুন:</span>
                    <span class="text-[10px] text-emerald-400">ড্রপডাউন থেকে বেছে নিন</span>
                </label>
                <select id="post-category" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-2xl text-xs text-white outline-none focus:border-red-500 transition cursor-pointer">
                    <option value="">-- ক্যাটাগরি সিলেক্ট করুন --</option>
                </select>
            </div>

            <!-- HD 1280p থাম্বনেইল আপলোড ও প্রিভিউ -->
            <div class="space-y-2 bg-slate-950/60 p-3.5 rounded-2xl border border-slate-800">
                <label class="text-xs font-semibold text-slate-300 flex justify-between items-center">
                    <span>থাম্বনেইল ফটো (HD 1280p Ultra Clear):</span>
                    <span id="photo-selected-name" class="text-[10px] text-slate-400 truncate max-w-[150px]"></span>
                </label>

                <label for="thumb-file-input" class="w-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-white text-xs font-bold py-2.5 px-4 rounded-xl cursor-pointer flex items-center justify-center gap-2 transition border border-slate-700 shadow">
                    <i class="fa-solid fa-image text-amber-400"></i>
                    <span>গ্যালারি থেকে ফটো সিলেক্ট করুন</span>
                </label>
                <input type="file" id="thumb-file-input" accept="image/*" onchange="handlePhotoUpload(this)" class="hidden">

                <div id="photo-preview-box" class="hidden pt-1">
                    <img id="photo-preview-img" src="" class="w-full h-48 object-cover rounded-xl border border-slate-700 shadow">
                </div>
                <input type="hidden" id="post-thumb-data">
            </div>

            <!-- ১ থেকে ৩টি ভিডিও আপলোড সেকশন -->
            <div class="space-y-3 bg-slate-950/60 p-3.5 rounded-2xl border border-slate-800">
                <label class="text-xs font-bold text-slate-200 block border-b border-slate-800 pb-1.5 flex justify-between items-center">
                    <span>ভিডিও ফাইলসমূহ (১ থেকে ৩টি ভিডিও):</span>
                    <span class="text-[10px] text-slate-400">ফাইল দিন বা সরাসরি লিংক দিন</span>
                </label>

                <!-- ভিডিও ১ -->
                <div class="space-y-2 bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <label class="text-[11px] font-bold text-red-400 block">🎬 ভিডিও ১ (প্রধান ভিডিও - Main):</label>
                    <div class="flex gap-2">
                        <label for="video-file-1" class="flex-1 bg-red-600 hover:bg-red-700 active:scale-95 text-white text-xs font-bold py-2 px-3 rounded-xl cursor-pointer flex items-center justify-center gap-1.5 shadow transition">
                            <i class="fa-solid fa-file-video"></i> ফাইল আপলোড
                        </label>
                        <input type="file" id="video-file-1" accept="video/*" onchange="uploadSingleVideo(this, 1)" class="hidden">
                    </div>
                    <input type="text" id="post-video-url-1" placeholder="অথবা ভিডিও ১ এর সরাসরি URL..." class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-xs text-white outline-none focus:border-red-500 font-poppins">

                    <div id="video-progress-1" class="hidden space-y-1 pt-1">
                        <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                            <div id="video-fill-1" class="bg-red-500 h-full w-0 transition-all duration-100"></div>
                        </div>
                        <p id="video-status-1" class="text-[10px] font-semibold text-slate-300 text-center font-poppins"></p>
                    </div>
                </div>

                <!-- ভিডিও ২ -->
                <div class="space-y-2 bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <label class="text-[11px] font-bold text-indigo-400 block">🎬 ভিডিও ২ (ঐচ্ছিক - Optional):</label>
                    <div class="flex gap-2">
                        <label for="video-file-2" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs font-bold py-2 px-3 rounded-xl cursor-pointer flex items-center justify-center gap-1.5 shadow transition">
                            <i class="fa-solid fa-file-video"></i> ফাইল আপলোড
                        </label>
                        <input type="file" id="video-file-2" accept="video/*" onchange="uploadSingleVideo(this, 2)" class="hidden">
                    </div>
                    <input type="text" id="post-video-url-2" placeholder="অথবা ভিডিও ২ এর সরাসরি URL..." class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-xs text-white outline-none focus:border-red-500 font-poppins">

                    <div id="video-progress-2" class="hidden space-y-1 pt-1">
                        <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                            <div id="video-fill-2" class="bg-indigo-500 h-full w-0 transition-all duration-100"></div>
                        </div>
                        <p id="video-status-2" class="text-[10px] font-semibold text-slate-300 text-center font-poppins"></p>
                    </div>
                </div>

                <!-- ভিডিও ৩ -->
                <div class="space-y-2 bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <label class="text-[11px] font-bold text-purple-400 block">🎬 ভিডিও ৩ (ঐচ্ছিক - Optional):</label>
                    <div class="flex gap-2">
                        <label for="video-file-3" class="flex-1 bg-purple-600 hover:bg-purple-700 active:scale-95 text-white text-xs font-bold py-2 px-3 rounded-xl cursor-pointer flex items-center justify-center gap-1.5 shadow transition">
                            <i class="fa-solid fa-file-video"></i> ফাইল আপলোড
                        </label>
                        <input type="file" id="video-file-3" accept="video/*" onchange="uploadSingleVideo(this, 3)" class="hidden">
                    </div>
                    <input type="text" id="post-video-url-3" placeholder="অথবা ভিডিও ৩ এর সরাসরি URL..." class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-xs text-white outline-none focus:border-red-500 font-poppins">

                    <div id="video-progress-3" class="hidden space-y-1 pt-1">
                        <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                            <div id="video-fill-3" class="bg-purple-500 h-full w-0 transition-all duration-100"></div>
                        </div>
                        <p id="video-status-3" class="text-[10px] font-semibold text-slate-300 text-center font-poppins"></p>
                    </div>
                </div>

            </div>

            <!-- পাবলিশ বা আপডেট বাটন -->
            <button onclick="publishOrUpdatePost()" id="submit-btn" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-95 text-white font-bold py-3.5 rounded-2xl text-xs shadow-lg shadow-red-600/30 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span id="submit-btn-text">পোস্ট পাবলিশ করুন</span>
            </button>

            <div id="alert-msg" class="hidden text-center text-xs font-bold p-3.5 rounded-xl"></div>
        </div>

        <!-- ৪. সকল ভিডিও ম্যানেজমেন্ট (লাইভ সিঙ্ক) -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-800 pb-3">
                <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-400"></i> সকল ভিডিও লিস্ট (<span id="total-count" class="font-poppins text-emerald-400">0</span>)
                </h2>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <input type="text" id="search-manage-input" oninput="filterAdminVideos()" placeholder="পোস্ট বা ক্যাটাগরি খুঁজুন..." class="flex-1 sm:w-56 bg-slate-950 border border-slate-700 px-3.5 py-2 rounded-xl text-xs text-white outline-none focus:border-red-500 transition">
                    <button onclick="fetchVideosListLive()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-xl text-slate-300 transition" title="রিফ্রেশ">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>
            </div>

            <!-- ভিডিও লিস্ট কন্টেইনার -->
            <div id="video-list-container" class="space-y-3">
                <p class="text-xs text-center text-slate-500 py-8">ভিডিও লোড হচ্ছে...</p>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD7LmMcBP48B8YCdsqxOQZy7-5_4QxfpyQ",
            authDomain: "telegram-87e84.firebaseapp.com",
            databaseURL: "https://telegram-87e84-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "telegram-87e84",
            storageBucket: "telegram-87e84.firebasestorage.app",
            messagingSenderId: "426281060354",
            appId: "1:426281060354:web:941f4b3ac31b3c71c5bf1b",
            measurementId: "G-3YMQVXJ9DL"
        };

        const catboxUserHash = "821d1a31a17407896add03c2d";

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        let cachedAdminVideos = [];
        let savedCategoriesList = [];

        // Adsterra Link লোড
        database.ref('settings/adLink').on('value', (snap) => {
            if (snap.exists()) {
                document.getElementById('adsterra-link-input').value = snap.val();
            }
        });

        function saveAdLink() {
            const link = document.getElementById('adsterra-link-input').value.trim();
            if(!link) { alert("একটি সঠিক লিংক দিন!"); return; }
            database.ref('settings/adLink').set(link)
            .then(() => {
                const status = document.getElementById('ad-save-status');
                status.innerText = "✅ Adsterra লিংক সফলভাবে সেভ হয়েছে!";
                status.className = "text-[11px] text-emerald-400 block font-semibold";
                setTimeout(() => status.className = "hidden", 3000);
            })
            .catch(err => alert("ত্রুটি: " + err.message));
        }

        // --- ক্যাটাগরি ম্যানেজমেন্ট ফাংশনসমূহ ---
        function loadSavedCategories() {
            database.ref('categories').on('value', (snap) => {
                savedCategoriesList = [];
                const container = document.getElementById('saved-categories-container');
                const selectDropdown = document.getElementById('post-category');
                
                container.innerHTML = '';
                selectDropdown.innerHTML = '<option value="">-- ক্যাটাগরি সিলেক্ট করুন --</option>';

                if (snap.exists()) {
                    snap.forEach(child => {
                        savedCategoriesList.push({ id: child.key, name: child.val() });
                    });
                }

                if (savedCategoriesList.length === 0) {
                    container.innerHTML = '<span class="text-xs text-slate-500 italic">কোনো ক্যাটাগরি সেভ করা নেই। উপরে নতুন ক্যাটাগরি লিখুন।</span>';
                    return;
                }

                savedCategoriesList.forEach(cat => {
                    // ১. ব্যাজ রেন্ডার
                    const badge = document.createElement('div');
                    badge.className = "bg-slate-950 border border-slate-700 px-3 py-1 rounded-xl text-xs text-slate-200 flex items-center gap-2 shadow";
                    badge.innerHTML = `
                        <span class="font-bold">${cat.name}</span>
                        <button onclick="deleteCategory('${cat.id}')" class="text-red-400 hover:text-red-300 font-bold ml-1" title="ডিলিট">×</button>
                    `;
                    container.appendChild(badge);

                    // ২. ড্রপডাউন অপশন রেন্ডার
                    const opt = document.createElement('option');
                    opt.value = cat.name;
                    opt.innerText = cat.name;
                    selectDropdown.appendChild(opt);
                });
            });
        }

        function addCategory() {
            const input = document.getElementById('new-category-input');
            const name = input.value.trim();
            if (!name) { alert("দয়া করে ক্যাটাগরির নাম লিখুন!"); return; }

            database.ref('categories').push(name)
            .then(() => {
                input.value = '';
            })
            .catch(err => alert("ত্রুটি: " + err.message));
        }

        function deleteCategory(catId) {
            if (confirm("এই ক্যাটাগরিটি ডিলিট করতে চান?")) {
                database.ref('categories/' + catId).remove();
            }
        }

        // HD 1280p ছবি প্রসেসিং
        function handlePhotoUpload(input) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById('photo-selected-name').innerText = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height, max = 1280;
                    if (width > height && width > max) { height *= max / width; width = max; }
                    else if (height > max) { width *= max / height; height = max; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                    document.getElementById('post-thumb-data').value = dataUrl;
                    document.getElementById('photo-preview-img').src = dataUrl;
                    document.getElementById('photo-preview-box').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Catbox ভিডিও আপলোড
        function uploadSingleVideo(input, index) {
            const file = input.files[0];
            if (!file) return;

            const totalMB = (file.size / (1024 * 1024)).toFixed(2);
            if (totalMB > 200) { alert('ভিডিও ফাইল ২০০ MB এর চেয়ে ছোট হতে হবে!'); input.value = ''; return; }

            const progressContainer = document.getElementById(`video-progress-${index}`);
            const progressFill = document.getElementById(`video-fill-${index}`);
            const statusText = document.getElementById(`video-status-${index}`);
            const submitBtn = document.getElementById('submit-btn');

            progressContainer.classList.remove('hidden');
            progressFill.style.width = '0%';
            statusText.innerText = `⏳ আপলোড শুরু হচ্ছে... (${totalMB} MB)`;
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('userhash', catboxUserHash);
            formData.append('fileToUpload', file);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://corsproxy.io/?https://catbox.moe/user/api.php', true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = percent + '%';
                    statusText.innerText = `⏳ আপলোড হচ্ছে (${percent}%)`;
                }
            };

            xhr.onload = function() {
                submitBtn.disabled = false;
                if (xhr.status === 200 && xhr.responseText.trim().startsWith('http')) {
                    document.getElementById(`post-video-url-${index}`).value = xhr.responseText.trim();
                    statusText.innerText = `✅ ভিডিও ${index} সফলভাবে আপলোড হয়েছে!`;
                    statusText.className = "text-[10px] font-bold text-emerald-400 text-center font-poppins";
                } else {
                    statusText.innerText = `❌ আপলোড ব্যর্থ হয়েছে!`;
                    statusText.className = "text-[10px] font-bold text-red-400 text-center font-poppins";
                }
                input.value = '';
            };

            xhr.onerror = function() {
                submitBtn.disabled = false;
                statusText.innerText = '❌ নেটওয়ার্ক ত্রুটি!';
                input.value = '';
            };

            xhr.send(formData);
        }

        // পোস্ট পাবলিশ বা এডিট সংরক্ষণ (ওভাররাইট ফিক্সড)
        function publishOrUpdatePost() {
            const editId = document.getElementById('edit-post-id').value.trim();
            const title = document.getElementById('post-title').value.trim();
            const category = document.getElementById('post-category').value.trim() || 'General';
            const thumb = document.getElementById('post-thumb-data').value.trim();
            const videoUrl1 = document.getElementById('post-video-url-1').value.trim();
            const videoUrl2 = document.getElementById('post-video-url-2').value.trim();
            const videoUrl3 = document.getElementById('post-video-url-3').value.trim();
            const alertMsg = document.getElementById('alert-msg');

            if (!title) { alert("দয়া করে শিরোনাম লিখুন!"); return; }
            if (!category) { alert("দয়া করে একটি ক্যাটাগরি সিলেক্ট করুন!"); return; }
            if (!thumb) { alert("একটি থাম্বনেইল ফটো দিন!"); return; }
            if (!videoUrl1 && !videoUrl2 && !videoUrl3) { alert("কমপক্ষে ১টি ভিডিও লিংক দিন!"); return; }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;

            const postData = {
                title: title,
                category: category,
                thumbnail1: thumb,
                url: videoUrl1 || videoUrl2 || videoUrl3,
                url1: videoUrl1 || '',
                url2: videoUrl2 || '',
                url3: videoUrl3 || ''
            };

            let savePromise;
            if (editId) {
                // এডিট মোড
                savePromise = database.ref('videos/' + editId).update(postData);
            } else {
                // নতুন পোস্ট মোড (সর্বদা নতুন ইউনিক কী-তে সেভ হবে)
                postData.views = 0;
                postData.createdAt = Date.now();
                savePromise = database.ref('videos').push(postData);
            }

            savePromise.then(() => {
                submitBtn.disabled = false;
                alertMsg.className = "text-center text-xs font-bold p-3.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                alertMsg.innerText = editId ? "🎉 পোস্ট সফলভাবে আপডেট হয়েছে!" : "🎉 নতুন পোস্ট সফলভাবে পাবলিশ হয়েছে!";
                alertMsg.classList.remove('hidden');

                cancelEdit(); // ফর্ম সম্পূর্ণ রিসেট যাতে নতুন পোস্ট আলাদাভাবে হয়
                setTimeout(() => alertMsg.classList.add('hidden'), 4000);
            }).catch(err => {
                submitBtn.disabled = false;
                alert("ত্রুটি: " + err.message);
            });
        }

        // সকল ভিডিও লাইভ লোড (Firebase Live Listener)
        function fetchVideosListLive() {
            database.ref('videos').on('value', (snap) => {
                cachedAdminVideos = [];
                if (snap.exists()) {
                    snap.forEach(child => {
                        cachedAdminVideos.push({ id: child.key, ...child.val() });
                    });
                    cachedAdminVideos.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                }
                renderAdminVideoList(cachedAdminVideos);
            });
        }

        // কার্ড আকারে ভিডিও দেখানো
        function renderAdminVideoList(videos) {
            const container = document.getElementById('video-list-container');
            container.innerHTML = '';
            document.getElementById('total-count').innerText = videos.length;

            if (videos.length === 0) {
                container.innerHTML = '<p class="text-xs text-center text-slate-500 py-8">কোনো পোস্ট পাওয়া যায়নি। নতুন পোস্ট পাবলিশ করুন।</p>';
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 p-3.5 rounded-2xl flex items-center justify-between gap-3.5 shadow";
                card.innerHTML = `
                    <img src="${video.thumbnail1 || ''}" class="w-16 h-12 object-cover rounded-lg bg-slate-800 border border-slate-700">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-xs font-bold text-white truncate">${video.title}</h4>
                        <p class="text-[10px] text-slate-400 mt-1 flex items-center gap-2.5 flex-wrap">
                            <span class="text-amber-400 font-bold bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20"><i class="fa-solid fa-tag"></i> ${video.category || 'General'}</span>
                            <span class="font-poppins"><i class="fa-solid fa-eye text-emerald-400"></i> ${video.views || 0} Views</span>
                            <span class="font-poppins text-slate-400"><i class="fa-solid fa-calendar-days text-indigo-400"></i> ${new Date(video.createdAt || Date.now()).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}</span>
                        </p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="editVideo('${video.id}')" class="bg-amber-600 hover:bg-amber-700 active:scale-95 text-white text-xs px-3 py-2 rounded-xl transition shadow" title="এডিট করুন">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteVideo('${video.id}')" class="bg-red-600 hover:bg-red-700 active:scale-95 text-white text-xs px-3 py-2 rounded-xl transition shadow" title="ডিলিট করুন">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // সার্চ ফিল্টার
        function filterAdminVideos() {
            const query = document.getElementById('search-manage-input').value.toLowerCase();
            const filtered = cachedAdminVideos.filter(v => (v.title || '').toLowerCase().includes(query) || (v.category || '').toLowerCase().includes(query));
            renderAdminVideoList(filtered);
        }

        // এডিট মোড লোড
        function editVideo(id) {
            database.ref('videos/' + id).once('value', (snap) => {
                if(!snap.exists()) return;
                const v = snap.val();
                document.getElementById('edit-post-id').value = id;
                document.getElementById('post-title').value = v.title || '';
                document.getElementById('post-category').value = v.category || '';
                document.getElementById('post-thumb-data').value = v.thumbnail1 || '';
                document.getElementById('photo-preview-img').src = v.thumbnail1 || '';
                document.getElementById('photo-preview-box').classList.remove('hidden');

                document.getElementById('post-video-url-1').value = v.url1 || v.url || '';
                document.getElementById('post-video-url-2').value = v.url2 || '';
                document.getElementById('post-video-url-3').value = v.url3 || '';

                document.getElementById('form-heading').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-400"></i> পোস্ট এডিট করুন';
                document.getElementById('submit-btn-text').innerText = 'আপডেট সংরক্ষণ করুন';
                document.getElementById('cancel-edit-btn').classList.remove('hidden');

                document.getElementById('post-form-card').scrollIntoView({ behavior: 'smooth' });
            });
        }

        // এডিট বাতিল
        function cancelEdit() {
            document.getElementById('edit-post-id').value = '';
            document.getElementById('post-title').value = '';
            document.getElementById('post-category').value = '';
            document.getElementById('post-thumb-data').value = '';
            document.getElementById('photo-selected-name').innerText = '';
            document.getElementById('photo-preview-box').classList.add('hidden');
            document.getElementById('post-video-url-1').value = '';
            document.getElementById('post-video-url-2').value = '';
            document.getElementById('post-video-url-3').value = '';

            document.getElementById('video-progress-1').classList.add('hidden');
            document.getElementById('video-progress-2').classList.add('hidden');
            document.getElementById('video-progress-3').classList.add('hidden');

            document.getElementById('form-heading').innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-red-500"></i> নতুন পোস্ট পাবলিশ করুন';
            document.getElementById('submit-btn-text').innerText = 'পোস্ট পাবলিশ করুন';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        // পোস্ট ডিলিট
        function deleteVideo(id) {
            if (confirm("⚠️ আপনি কি নিশ্চিত এই ভিডিও পোস্টটি সম্পূর্ণ ডিলিট করতে চান?")) {
                database.ref('videos/' + id).remove()
                .catch(err => alert("মুছে ফেলা যায়নি: " + err.message));
            }
        }

        window.onload = function() {
            loadSavedCategories();
            fetchVideosListLive();
        };
    </script>
</body>
</html>
